name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build

      # Fails when the initial load, the Stellar scanner worker, or any
      # lazy-loaded route/chain chunk grows past its budget. See
      # scripts/bundle-budget-gate.mjs for what each budget covers and why.
      - run: pnpm build:budget-check

      # Fails when a new critical (or more than the accepted number of high)
      # production dependency finding appears. See docs/SECURITY_AUDIT.md.
      - run: pnpm audit:gate

  # Wave 11: Playwright wallet and transaction matrix CI
  # Runs send, receive, wallet connect/disconnect, vault claim/refund, and
  # failure-path matrix across all supported engines (Chromium, Firefox, WebKit).
  # All wallet connections and network calls are mocked deterministically.
  # Traces, screenshots, and videos upload only on retry or final failure.
  # No live key, wallet extension, or public RPC is required.
  playwright-matrix-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # Run the matrix of Playwright tests across all browsers.
      # Each browser project uses the same test files but with browser-specific
      # configuration. Wallet mocks and network intercepts are deterministic.
      - name: Run Playwright matrix tests
        run: pnpm test:e2e
        env:
          # Enable trace and video only on failure to keep artifact size bounded
          PLAYWRIGHT_trace: on-first-retry
          PLAYWRIGHT_video: retain-on-failure
          PLAYWRIGHT_screenshot: only-on-failure

      # Upload test artifacts only on final failure across any browser
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-matrix-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-matrix-results
          path: test-results/
          if-no-files-found: ignore

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: |
          mkdir -p test-results/secret-scan
          set -o pipefail
          pnpm test:unit --reporter=default --reporter=junit --outputFile.junit=reports/unit/junit.xml 2>&1 | tee test-results/secret-scan/unit-console.log
        env:
          CI: true

      - name: Scan unit-test artifacts for seeded secrets
        id: secret_scan
        if: always()
        run: |
          if pnpm secrets:gate; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Keeps the machine-readable report out of the repository and attaches
      # it to the run so a failing assertion can be inspected after the fact.
      - name: Upload unit test report
        if: always() && steps.secret_scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit/
          if-no-files-found: ignore

  pwa-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # First-install / offline reload, SW update activation & cache migration,
      # and bounded precache storage-pressure coverage.
      - name: Run PWA E2E tests
        run: |
          mkdir -p test-results/secret-scan
          set -o pipefail
          pnpm test:pwa 2>&1 | tee test-results/secret-scan/pwa-console.log
        env:
          CI: true

      - name: Scan PWA artifacts for seeded secrets
        id: secret_scan
        if: always()
        run: |
          if pnpm secrets:gate; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload PWA test report
        if: always() && steps.secret_scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-test-report
          path: playwright-report/
          if-no-files-found: ignore

  secret-scan-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify secret gate rejects a logged canary
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          printf '%s\n' 'WRAITH_CANARY_ABC123' > "$fixture/console.log"
          if env -u GITHUB_OUTPUT SECRET_SCAN_PATHS="$fixture" pnpm secrets:gate; then
            echo "Secret gate accepted a deliberately logged canary"
            exit 1
          fi

      - name: Run browser secret scan regression
        run: |
          mkdir -p reports/secret-scan
          set -o pipefail
          pnpm test:secret-scan 2>&1 | tee reports/secret-scan/browser-console.log
        env:
          CI: true

      - name: Scan browser artifacts for seeded secrets
        id: secret_scan
        if: always()
        run: |
          if pnpm secrets:gate; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload browser secret scan artifacts
        if: always() && steps.secret_scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-test-report
          path: |
            playwright-report/
            reports/secret-scan/
            test-results/
          if-no-files-found: ignore
