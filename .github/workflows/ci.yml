name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build

      # Fails when the initial load, the Stellar scanner worker, or any
      # lazy-loaded route/chain chunk grows past its budget. See
      # scripts/bundle-budget-gate.mjs for what each budget covers and why.
      - run: pnpm build:budget-check

      # Fails when a new critical (or more than the accepted number of high)
      # production dependency finding appears. See docs/SECURITY_AUDIT.md.
      - run: pnpm audit:gate

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit --reporter=default --reporter=junit --outputFile.junit=reports/unit/junit.xml
        env:
          CI: true

      # Keeps the machine-readable report out of the repository and attaches
      # it to the run so a failing assertion can be inspected after the fact.
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit/
          if-no-files-found: ignore

  pwa-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # First-install / offline reload, SW update activation & cache migration,
      # and bounded precache storage-pressure coverage.
      - name: Run PWA E2E tests
        run: pnpm test:pwa
        env:
          CI: true

      - name: Upload PWA test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-test-report
          path: playwright-report/
          if-no-files-found: ignore

  stellar-e2e:
    name: Stellar E2E (deterministic - mocked Freighter + Horizon, no credentials)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (installs pnpm from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
          pnpm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Required check: runs fully offline against the mocked Freighter wallet and
      # mocked Horizon / Soroban RPC from e2e/fixtures.ts. No contributor
      # credentials or live network are needed.
      - name: Run deterministic Stellar E2E
        run: pnpm test:e2e:stellar
        env:
          CI: true
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/stellar-e2e.json

      - name: Fail if any Stellar E2E test was skipped
        run: |
          node -e '
            const s = require("./reports/stellar-e2e.json").stats;
            console.log(`Stellar E2E: expected=${s.expected} skipped=${s.skipped} flaky=${s.flaky} unexpected=${s.unexpected}`);
            if (s.skipped > 0) {
              console.error("Stellar E2E must never skip: " + s.skipped + " test(s) were skipped. Remove the test.skip()/conditional or provide the missing fixture in e2e/fixtures.ts.");
              process.exit(1);
            }
          '

      - name: Upload Stellar E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stellar-e2e-report
          path: |
            playwright-report/
            reports/stellar-e2e.json
          if-no-files-found: ignore
