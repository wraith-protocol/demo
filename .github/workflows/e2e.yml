name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Runs inside the Playwright container so browser binaries and system
    # fonts match the versions specs are authored against.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@10.28.2

      - run: pnpm install --frozen-lockfile

      - name: Ensure Chromium is installed
        run: pnpm exec playwright install chromium

      - name: Run Playwright (chromium, failure-path matrix only)
        # Scoped to the failure-path matrix so this workflow does not own
        # unrelated pre-existing spec failures (LocaleSwitcher select
        # ambiguity in `stellar.spec.ts`, unrouted requests in the vault
        # specs, etc). Chromium-only keeps the run tight; the full
        # multi-browser matrix stays available locally via `pnpm test:e2e`.
        run: pnpm exec playwright test e2e/send-failure-matrix.spec.ts e2e/flows-failure-matrix.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
